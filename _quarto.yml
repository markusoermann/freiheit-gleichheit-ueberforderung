project:
  type: book
  output-dir: _site

book:
  title: "Freiheit, Gleichheit, Überforderung"
  output-file: "freiheit-gleichheit-ueberforderung"
  downloads: [pdf]
  search: true
  reader-mode: true
  page-navigation: true
  chapters:
    # BEGIN chapters
    - index.qmd
    - chapters/vorwort.qmd
    - chapters/einleitung.qmd
    - chapters/kap-01.qmd
    # END chapters
  page-footer:
    left: "Erstellt mit KI und kuratiert von Markus Oermann"
    right: "© 2026 · Alle Rechte vorbehalten, frei lesbar und verlinkbar"

lang: de

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: true
    toc-title: "Auf dieser Seite"
    number-sections: false
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    include-after-body:
      text: |
        <script>
        window.addEventListener('DOMContentLoaded', function () {
          document.querySelectorAll('a').forEach(function (a) {
            if (a.textContent.trim() === 'index.html') a.textContent = 'Start';
          });
        });
        </script>
  typst:
    papersize: a4
    margin:
      x: 4cm
      y: 3.2cm
    mainfont: "Inter"
    font-paths: ["assets/fonts"]
    fontsize: 11pt
    linestretch: 1.5
    linkcolor: "#2f6690"
    toc: false
    section-numbering: ""
    number-sections: false
    template-partials:
      - assets/typst/typst-template.typ
      - assets/typst/typst-show.typ
